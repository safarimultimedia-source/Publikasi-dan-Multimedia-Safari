
<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Safari Multimedia – P&amp;M SAFARI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--a:#33d6c6;--b:#3344df;--g:linear-gradient(135deg,#33d6c6,#3344df);--bg:#0a0f24;--card:#131a36;--mut:#9aa6d1}
*{box-sizing:border-box;margin:0}
body{font:16px/1.65 Inter,system-ui,sans-serif;background:var(--bg);color:#e8ecff;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,.fh{font-family:Poppins,sans-serif}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
header{position:sticky;top:0;z-index:50;background:rgba(10,15,36,.88);backdrop-filter:blur(10px);border-bottom:1px solid #ffffff14;display:flex;align-items:center;justify-content:space-between;padding:.6rem 5%}
.brand{display:flex;align-items:center;gap:.6rem;font:800 1.1rem Poppins}.brand svg{width:38px}
.gt{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:.2rem}nav a{padding:.4rem .75rem;border-radius:99px;font-size:.9rem;color:#b9c3ee;transition:.25s}
nav a:hover,nav a.on{background:var(--g);color:#fff}
#burger{display:none;background:none;border:0;color:#fff;cursor:pointer;font-size:1.6rem}
main{flex:1;padding:2rem 5%;max-width:1150px;width:100%;margin:auto}
.page{animation:pg .5s ease}@keyframes pg{from{opacity:0;transform:translateY(14px)}}
.hero{text-align:center;padding:2.5rem 0}.hero .logo{width:130px;margin:auto;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-12px)}}
.hero h1{font-size:clamp(2.4rem,8vw,4.4rem);font-weight:800;line-height:1.1;margin-top:.8rem}
.typing{min-height:1.8em;color:var(--a);font-weight:600}.typing:after{content:'|';animation:bl 1s infinite}@keyframes bl{50%{opacity:0}}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.65rem 1.3rem;border:0;border-radius:99px;background:var(--g);color:#fff;font:600 .92rem Inter;cursor:pointer;transition:.25s;margin:.2rem}
.btn:hover{transform:translateY(-3px);box-shadow:0 8px 24px #3344df66}.btn:disabled{opacity:.5}
.btn.o{background:transparent;border:1px solid #ffffff33}.btn.r{background:#d33}.btn.s{padding:.3rem .8rem;font-size:.8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.2rem}
.card{background:var(--card);border:1px solid #ffffff12;border-radius:18px;padding:1.4rem;transition:.3s}
.grid>.card:hover{transform:translateY(-6px);border-color:var(--a)}
.ic{width:1.4em;height:1.4em;vertical-align:middle}.card>.ic{width:2.4rem;height:2.4rem;color:var(--a);margin-bottom:.6rem}
.mem{text-align:center}.mem img,.av{width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid var(--a);background:#1b2450}
.av{width:80px;height:80px}
h2.sec{font-size:1.7rem;margin:2.2rem 0 1rem}h2.sec:after{content:'';display:block;width:60px;height:4px;border-radius:4px;background:var(--g);margin-top:.4rem}
.rv{opacity:0;transform:translateY(24px);transition:.7s}.rv.in{opacity:1;transform:none}
.stats b{font:800 2.2rem Poppins;display:block}.stats .card{text-align:center}
.gal img,.gal video{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#1b2450}.gal img{cursor:zoom-in;transition:.3s}.gal img:hover{transform:scale(1.03)}
.tabs{display:flex;gap:.5rem;margin-bottom:1rem}.chip{font-size:.78rem;color:var(--a)}
#lb,#modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:100}
#lb.on,#modal.on{display:flex}#lb img{max-width:88vw;max-height:85vh;border-radius:12px}
.lbb{position:absolute;background:#ffffff22;border:0;color:#fff;font-size:1.6rem;width:46px;height:46px;border-radius:50%;cursor:pointer}
#toast{position:fixed;bottom:1rem;right:1rem;z-index:200;display:grid;gap:.5rem}
.t{background:var(--card);border-left:4px solid var(--a);padding:.7rem 1rem;border-radius:10px;animation:pg .3s}.t.e{border-color:#f55}
input,textarea{width:100%;padding:.65rem .8rem;border-radius:10px;border:1px solid #ffffff22;background:#0d1330;color:#fff;font:inherit;margin:.25rem 0 .8rem}
label{font-size:.85rem;color:var(--mut)}table{width:100%;border-collapse:collapse}
th,td{padding:.55rem;border-bottom:1px solid #ffffff14;text-align:left;font-size:.88rem;vertical-align:top}
.adm{display:grid;grid-template-columns:210px 1fr;gap:1.2rem;align-items:start}
.side{display:grid;gap:.4rem;text-align:center;justify-items:center}.side button{width:100%;background:none;border:1px solid #ffffff1f;color:#fff;padding:.5rem;border-radius:10px;cursor:pointer}
.side button.on,.side button:hover{background:var(--g);border-color:transparent}
.bar{height:10px;background:#ffffff18;border-radius:9px;overflow:hidden;margin:.5rem 0}.bar i{display:block;height:100%;background:var(--g);width:0;transition:.4s}
.soc a{display:inline-flex;padding:.6rem;border-radius:50%;background:#ffffff14;margin:0 .2rem;transition:.25s}.soc a:hover{background:var(--g);transform:translateY(-3px)}
footer{background:#070b1a;padding:2rem 5%;text-align:center;border-top:1px solid #ffffff14;color:var(--mut)}footer a{margin:0 .5rem}
@media(max-width:820px){#burger{display:block}nav{position:fixed;top:58px;right:-100%;flex-direction:column;background:#0a0f24;width:70%;height:100vh;padding:1rem;transition:.3s}nav.open{right:0}.adm{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style></head><body>
<header><a class="brand" href="#home"><span id="hl"></span><span class="gt">P&amp;M SAFARI</span></a>
<nav id="nav"><a href="#home">Home</a><a href="#profil">Profil</a><a href="#keahlian">Keahlian</a><a href="#pekerjaan">Pekerjaan</a><a href="#galeri">Galeri</a><a href="#pengumuman">Pengumuman</a><a href="#kontak">Kontak</a><a href="#admin">Admin</a></nav>
<button id="burger" data-act="menu" aria-label="Menu">☰</button></header>
<main id="app"></main><footer id="foot"></footer>
<div id="toast"></div><div id="modal"></div>
<div id="lb"><button class="lbb" data-act="lbx" style="top:1rem;right:1rem">✕</button><button class="lbb" data-act="lbp" style="left:1rem">‹</button><img id="lbi" alt=""><button class="lbb" data-act="lbn" style="right:1rem">›</button></div>
<script>
'use strict';
/* ===== KONFIGURASI (edit di sini) ===== */
const CONFIG={
  wa:'6281238824446',
  social:{fb:'https://facebook.com/',ig:'https://instagram.com/',yt:'https://youtube.com/'},
  FOTO_LOKAL:[/* 'img/foto1.jpg','img/foto2.jpg' */],   // foto dari folder img/
  VIDEO_LOKAL:[/* 'img/video1.mp4' */],                 // video dari folder img/
  MEMBERS:{
    ketua:{key:'ketua',nama:'Nama Ketua',jabatan:'Ketua Seksi P&M',bio:'Memimpin seksi Publikasi dan Multimedia Biara Vokasionis Maumere.',foto:'img/ketua.jpg'},
    wakil:{key:'wakil',nama:'Nama Wakil Ketua',jabatan:'Wakil Ketua Seksi P&M',bio:'Mendampingi ketua dalam seluruh karya publikasi dan multimedia.',foto:'img/wakil.jpg'}},
  KEAHLIAN:[['design','Design','Poster, logo, dan materi visual komunitas.'],['print','Digital Printing','Cetak digital cepat untuk banner, brosur, dan kartu.'],['code','Programming','Website dan sistem otomatis sesuai kebutuhan.'],['edit','Editing','Penyuntingan video dan audio.'],['photo','Foto','Dokumentasi kegiatan dan potret komunitas.'],['book','Percetakan','Cetak buku dan booklet.']],
  PEKERJAAN:[['edit','Edit Foto dan Video','Mengolah dokumentasi kegiatan menjadi karya siap tayang.'],['code','Buat Sistem Otomatis','Membangun sistem yang mempercepat pekerjaan administrasi.'],['book','Cetak Buku (Gaudium)','Menyusun dan mencetak buku Gaudium.']],
  SESSION_MIN:20};
const ICON={design:'<path d="M12 19l7-7 3 3-7 7zM18 13l-1.5-7.5L2 2l3.5 14.5L13 18z"/>',print:'<path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',code:'<path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/>',edit:'<rect x="2" y="2" width="20" height="20" rx="2"/><path d="M7 2v20M17 2v20M2 12h20"/>',photo:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5z"/><path d="M20 17v5H6.5A2.5 2.5 0 0 1 4 19.5"/>',fb:'<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>',ig:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/>',yt:'<rect x="2" y="5" width="20" height="14" rx="4"/><path fill="currentColor" d="M10 9l5 3-5 3z"/>',wa:'<path d="M3 21l1.7-5A8.5 8.5 0 1 1 8 19.3z"/><path d="M9 9c0 3 3 6 6 6l1-1.5-2-1-1 .8c-1-.5-2-1.5-2.3-2.5l.8-1-1-2z"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;
const LOGO='<svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#33d6c6"/><stop offset="1" stop-color="#3344df"/></linearGradient></defs><rect x="14" y="6" width="16" height="12" rx="4" fill="url(#lg)"/><rect x="4" y="14" width="56" height="38" rx="9" fill="url(#lg)"/><circle cx="32" cy="33" r="13" fill="#0a0f24"/><path d="M28 26l12 7-12 7z" fill="#fff"/></svg>';
const PH='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#1b2450"/><circle cx="50" cy="38" r="18" fill="#33d6c6"/><path d="M15 95c0-22 15-32 35-32s35 10 35 32z" fill="#3344df"/></svg>');

/* ===== UTILITAS ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const fmtDate=t=>new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
const fmtB=n=>n>1e9?(n/1e9).toFixed(2)+' GB':n>1e6?(n/1e6).toFixed(1)+' MB':Math.round(n/1e3)+' KB';
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
let live=[];const bu=b=>{const u=URL.createObjectURL(b);live.push(u);return u};   // Blob URL, dibersihkan tiap pindah halaman
const src=x=>x instanceof Blob?bu(x):x;
const toast=(m,e)=>{const t=document.createElement('div');t.className='t'+(e?' e':'');t.textContent=m;$('#toast').append(t);setTimeout(()=>t.remove(),3500)};
const ask=m=>new Promise(r=>{const o=$('#modal');o.innerHTML=`<div class="card"><p>${esc(m)}</p><br><button class="btn r s" id="y">Ya, lanjutkan</button><button class="btn o s" id="n">Batal</button></div>`;o.classList.add('on');const c=v=>{o.classList.remove('on');r(v)};$('#y').onclick=()=>c(true);$('#n').onclick=()=>c(false)});
const resize=(file,max=1400)=>new Promise((res,rej)=>{if(!file.type.startsWith('image/'))return rej(new Error('File harus berupa gambar'));const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('Gagal memproses gambar')),'image/jpeg',.82)};img.onerror=()=>rej(new Error('Gambar tidak valid'));img.src=u});
const b2u=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
const ser=async o=>{const r={};for(const[k,v]of Object.entries(o))r[k]=v instanceof Blob?{__b:await b2u(v)}:v;return r};
const deser=async o=>{const r={};for(const[k,v]of Object.entries(o))r[k]=v&&v.__b?await(await fetch(v.__b)).blob():v;return r};

/* ===== DATABASE: wrapper IndexedDB berbasis Promise ===== */
const DB=(()=>{let db;
  const STORES={announcements:{keyPath:'id',autoIncrement:true},gallery:{keyPath:'id',autoIncrement:true},members:{keyPath:'key'},settings:{keyPath:'key'}};
  const open=()=>new Promise((res,rej)=>{if(db)return res(db);if(!window.indexedDB)return rej(new Error('Browser tidak mendukung IndexedDB'));
    const r=indexedDB.open('SafariMultimediaDB',1);
    r.onupgradeneeded=e=>{const d=e.target.result;for(const[n,o]of Object.entries(STORES))if(!d.objectStoreNames.contains(n))d.createObjectStore(n,o)};
    r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=()=>rej(r.error)});
  const tx=async(s,mode,fn)=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction(s,mode);const rq=fn(t.objectStore(s));t.oncomplete=()=>res(rq&&rq.result);t.onerror=t.onabort=()=>rej(t.error||new Error('Transaksi gagal (penyimpanan penuh?)'))})};
  return{open,add:(s,v)=>tx(s,'readwrite',o=>o.add(v)),put:(s,v)=>tx(s,'readwrite',o=>o.put(v)),get:(s,k)=>tx(s,'readonly',o=>o.get(k)),all:s=>tx(s,'readonly',o=>o.getAll()),del:(s,k)=>tx(s,'readwrite',o=>o.delete(k)),clear:s=>tx(s,'readwrite',o=>o.clear())};
})();
const STORE_NAMES=['announcements','gallery','members','settings'];
const Data={ // backup dan restore (blob diubah ke base64)
  async export(){const d={};for(const s of STORE_NAMES)d[s]=await Promise.all((await DB.all(s)).map(ser));return{app:'safari-multimedia',v:1,date:new Date().toISOString(),data:d}},
  async import(o){if(!o||o.app!=='safari-multimedia'||!o.data)throw new Error('File backup tidak valid');for(const s of STORE_NAMES){await DB.clear(s);for(const x of o.data[s]||[])await DB.put(s,await deser(x))}}};

/* ===== AUTH ===== */
const Auth={
  async init(){let a=await DB.get('settings','admin');
    if(!a){try{const r=await fetch('data.json');if(r.ok)await Data.import(await r.json())}catch(e){}  // data awal opsional (hosting)
      a=await DB.get('settings','admin');
      if(!a)await DB.put('settings',{key:'admin',user:'admin',hash:await sha('admin123'),nama:'Admin P&M',foto:null})}},
  async login(u,p){const a=await DB.get('settings','admin');if(a&&u===a.user&&await sha(p)===a.hash){sessionStorage.setItem('sm_s',Date.now());return true}return false},
  ok(){const t=+sessionStorage.getItem('sm_s');return !!t&&Date.now()-t<CONFIG.SESSION_MIN*60000},
  touch(){if(this.ok())sessionStorage.setItem('sm_s',Date.now())},
  logout(){sessionStorage.removeItem('sm_s')}};

/* ===== STATE, LIGHTBOX ===== */
const State={gtab:'foto',atab:'profil',asort:'desc'};
const LB={i:0,list:[],open(i){this.i=i;$('#lb').classList.add('on');this.show()},show(){$('#lbi').src=this.list[this.i]},go(d){this.i=(this.i+d+this.list.length)%this.list.length;this.show()},close(){$('#lb').classList.remove('on')}};
const getMembers=async()=>{const o={};for(const k of['ketua','wakil'])o[k]=(await DB.get('members',k))||CONFIG.MEMBERS[k];return o};
const memCard=(m,full)=>`<div class="card mem"><img src="${esc(src(m.foto))}" alt="${esc(m.nama)}" onerror="this.onerror=null;this.src=PH"><h3>${esc(m.nama)}</h3><p class="gt fh">${esc(m.jabatan)}</p>${full?`<p style="color:var(--mut)">${esc(m.bio)}</p>`:''}</div>`;
const infoCards=l=>`<div class="grid">${l.map(([i,t,d])=>`<div class="card rv">${ic(i)}<h3>${t}</h3><p style="color:var(--mut)">${d}</p></div>`).join('')}</div>`;
const social=()=>`<div class="soc">${['fb','ig','yt'].map(k=>`<a href="${CONFIG.social[k]}" target="_blank" rel="noopener" aria-label="${k}">${ic(k)}</a>`).join('')}<a href="https://wa.me/${CONFIG.wa}" target="_blank" rel="noopener" aria-label="WhatsApp">${ic('wa')}</a></div>`;

/* ===== HALAMAN PUBLIK ===== */
const Pages={
  async home(){const m=await getMembers(),g=await DB.all('gallery'),n=(await DB.all('announcements')).length;
    return`<section class="hero page"><div class="logo">${LOGO}</div><h1 class="gt">P&amp;M SAFARI</h1><p class="fh">Safari Multimedia</p><div class="typing" id="typ"></div>
    <p style="max-width:640px;margin:1rem auto 1.5rem;color:var(--mut)">Website resmi Seksi Publikasi dan Multimedia Biara Vokasionis Maumere. Di sini Anda bisa melihat anggota, keahlian, pekerjaan, galeri, dan pengumuman terbaru kami.</p>
    <a class="btn" href="#galeri">Lihat galeri</a><a class="btn o" href="#kontak">Hubungi kami</a></section>
    <div class="grid stats rv"><div class="card"><b data-n="${n}">0</b>Pengumuman</div><div class="card"><b data-n="${CONFIG.FOTO_LOKAL.length+g.filter(x=>x.type==='foto').length}">0</b>Foto</div><div class="card"><b data-n="${CONFIG.VIDEO_LOKAL.length+g.filter(x=>x.type==='video').length}">0</b>Video</div><div class="card"><b data-n="${CONFIG.KEAHLIAN.length}">0</b>Keahlian</div></div>
    <h2 class="sec rv">Anggota</h2><div class="grid rv">${memCard(m.ketua)}${memCard(m.wakil)}</div>`},
  async profil(){const m=await getMembers();return`<div class="page"><h2 class="sec">Profil ketua dan wakil ketua</h2><div class="grid">${memCard(m.ketua,1)}${memCard(m.wakil,1)}</div></div>`},
  async keahlian(){return`<div class="page"><h2 class="sec">Keahlian</h2>${infoCards(CONFIG.KEAHLIAN)}</div>`},
  async pekerjaan(){return`<div class="page"><h2 class="sec">Pekerjaan</h2>${infoCards(CONFIG.PEKERJAAN)}</div>`},
  async galeri(){const db=await DB.all('gallery'),t=State.gtab;
    const items=[...(t==='foto'?CONFIG.FOTO_LOKAL:CONFIG.VIDEO_LOKAL),...db.filter(x=>x.type===t).map(x=>x.blob)].map(src);
    LB.list=items;
    const body=!items.length?`<div class="card">Belum ada ${t}</div>`:
      `<div class="grid gal">${items.map((u,i)=>t==='foto'?`<img src="${esc(u)}" loading="lazy" alt="Foto ${i+1}" data-act="lb" data-i="${i}">`:`<video src="${esc(u)}" controls preload="metadata"></video>`).join('')}</div>`;
    return`<div class="page"><h2 class="sec">Galeri</h2><div class="tabs"><button class="btn ${t==='foto'?'':'o'}" data-act="gtab" data-v="foto">Foto</button><button class="btn ${t==='video'?'':'o'}" data-act="gtab" data-v="video">Video</button></div>${body}</div>`},
  async pengumuman(){const l=(await DB.all('announcements')).sort((a,b)=>b.tgl-a.tgl);
    return`<div class="page"><h2 class="sec">Pengumuman</h2><input data-filter="#al" placeholder="Cari pengumuman…" aria-label="Cari"><div id="al" class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${l.length?l.map(a=>`<article class="card" data-t="${esc((a.judul+' '+a.isi).toLowerCase())}"><span class="chip">${fmtDate(a.tgl)}</span><h3>${esc(a.judul)}</h3>${a.img?`<img src="${esc(src(a.img))}" alt="" style="width:100%;border-radius:12px;margin:.6rem 0">`:''}<p style="white-space:pre-wrap;color:var(--mut)">${esc(a.isi)}</p></article>`).join(''):'<div class="card">Belum ada pengumuman.</div>'}</div></div>`},
  async kontak(){return`<div class="page"><h2 class="sec">Kontak</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="card"><h3>Hubungi lewat WhatsApp</h3><p style="color:var(--mut)">081238824446</p><br><a class="btn" href="https://wa.me/${CONFIG.wa}" target="_blank" rel="noopener">${ic('wa')} Chat sekarang</a><br><br>${social()}</div>
    <form class="card" data-form="kontak"><label>Nama</label><input name="n" required><label>Pesan</label><textarea name="m" rows="4" required></textarea><button class="btn" type="submit">Kirim ke WhatsApp</button></form></div></div>`},
  async admin(){
    if(!Auth.ok())return`<div class="card page" style="max-width:380px;margin:2rem auto"><h2 class="gt">Login admin</h2><form data-form="login"><label>Username</label><input name="u" required autocomplete="username"><label>Password</label><input name="p" type="password" required autocomplete="current-password"><button class="btn" type="submit">Masuk</button></form><p style="font-size:.8rem;color:var(--mut)"></p></div>`;
    const a=await DB.get('settings','admin'),t=State.atab,tabs=[['profil','Profil admin'],['ann','Pengumuman'],['gal','Galeri'],['mem','Anggota'],['data','Data']];
    return`<div class="adm page"><aside class="card side"><img class="av" src="${a.foto?bu(a.foto):PH}" alt=""><b>${esc(a.nama)}</b>${tabs.map(([k,l])=>`<button data-act="atab" data-v="${k}" class="${t===k?'on':''}">${l}</button>`).join('')}<button data-act="logout">Keluar</button></aside><section>${await Tabs[t](a)}</section></div>`}
};

/* ===== TAB ADMIN ===== */
const Tabs={
  async profil(a){return`<div class="card"><h3>Profil admin</h3><br><form data-form="profil"><img id="pv" class="av" src="${a.foto?bu(a.foto):PH}" alt=""><br><label>Foto profil</label><input type="file" name="foto" accept="image/*" data-prev="pv"><label>Nama</label><input name="nama" value="${esc(a.nama)}" required><button class="btn" type="submit">Simpan profil</button></form></div><br>
    <div class="card"><h3>Ganti password</h3><br><form data-form="pass"><label>Password lama</label><input name="lama" type="password" required><label>Password baru (min. 6 karakter)</label><input name="baru" type="password" required><button class="btn" type="submit">Ganti password</button></form></div>`},
  async ann(){const l=(await DB.all('announcements')).sort((a,b)=>State.asort==='desc'?b.tgl-a.tgl:a.tgl-b.tgl);
    return`<div class="card"><h3 id="aft">Buat pengumuman</h3><br><form data-form="ann" id="af"><input type="hidden" name="id"><label>Judul</label><input name="judul" required><label>Isi</label><textarea name="isi" rows="4" required></textarea><label>Gambar (opsional)</label><input type="file" name="img" accept="image/*"><button class="btn" type="submit">Simpan pengumuman</button><button class="btn o" type="button" data-act="refresh">Batal</button></form></div><br>
    <div class="card" style="overflow-x:auto"><input data-filter="#at" placeholder="Cari di daftar…" aria-label="Cari"><table><thead><tr><th>Judul</th><th><a href="#admin" data-act="asort" style="cursor:pointer">Tanggal ${State.asort==='desc'?'▼':'▲'}</a></th><th>Aksi</th></tr></thead><tbody id="at">${l.map(a=>`<tr data-t="${esc((a.judul+' '+a.isi).toLowerCase())}"><td>${esc(a.judul)}</td><td>${fmtDate(a.tgl)}</td><td><button class="btn s" data-act="annEdit" data-id="${a.id}">Edit</button><button class="btn r s" data-act="annDel" data-id="${a.id}">Hapus</button></td></tr>`).join('')||'<tr><td colspan="3">Belum ada pengumuman.</td></tr>'}</tbody></table></div>`},
  async gal(){const l=await DB.all('gallery');
    return`<div class="card"><h3>Unggah foto atau video</h3><br><form data-form="upload"><input type="file" name="files" accept="image/*,video/*" multiple required><p style="font-size:.8rem;color:var(--mut)">Foto maks. 15 MB (otomatis dikecilkan). Video maks. 300 MB.</p><div class="bar"><i id="pb"></i></div><button class="btn" type="submit">Unggah</button></form></div><br>
    <div class="grid gal">${l.map(x=>`<div class="card">${x.type==='foto'?`<img src="${bu(x.blob)}" alt="">`:`<video src="${bu(x.blob)}" controls preload="metadata"></video>`}<p style="font-size:.8rem;word-break:break-all">${esc(x.name)}</p><button class="btn r s" data-act="galDel" data-id="${x.id}">Hapus</button></div>`).join('')||'<div class="card">Belum ada unggahan.</div>'}</div>`},
  async mem(){const m=await getMembers();
    return['ketua','wakil'].map(k=>{const x=m[k];return`<div class="card"><h3>${k==='ketua'?'Ketua':'Wakil ketua'}</h3><br><form data-form="anggota"><input type="hidden" name="key" value="${k}"><img id="pv${k}" class="av" src="${esc(src(x.foto))}" onerror="this.onerror=null;this.src=PH" alt=""><br><label>Foto</label><input type="file" name="foto" accept="image/*" data-prev="pv${k}"><label>Nama</label><input name="nama" value="${esc(x.nama)}" required><label>Jabatan</label><input name="jabatan" value="${esc(x.jabatan)}" required><label>Deskripsi</label><textarea name="bio" rows="3">${esc(x.bio)}</textarea><button class="btn" type="submit">Simpan</button></form></div><br>`}).join('')},
  async data(){const est=navigator.storage&&navigator.storage.estimate?await navigator.storage.estimate():null;
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();   // minta penyimpanan permanen
    const p=est&&est.quota?Math.min(100,est.usage/est.quota*100):0;
    return`<div class="card"><h3>Penyimpanan</h3>${est?`<div class="bar"><i style="width:${p}%"></i></div><p>${fmtB(est.usage)} terpakai dari ${fmtB(est.quota)} (${p.toFixed(2)}%)</p>`:'<p>Informasi kuota tidak tersedia.</p>'}</div><br>
    <div class="card"><h3>Backup dan restore</h3><p style="color:var(--mut)">Simpan data ke file JSON. Letakkan sebagai data.json di hosting agar menjadi data awal.</p><br><button class="btn" data-act="export">Ekspor data</button><label class="btn o" for="imp">Impor data</label><input type="file" id="imp" accept=".json" hidden><br><br><button class="btn r s" data-act="reset">Hapus semua data</button></div>`}
};

/* ===== FORM ===== */
const Forms={
  async login(f,d){if(await Auth.login(d.get('u').trim(),d.get('p'))){toast('Login berhasil');route(1)}else throw new Error('Username atau password salah')},
  async kontak(f,d){window.open(`https://wa.me/${CONFIG.wa}?text=${encodeURIComponent(`Halo P&M Safari, saya ${d.get('n')}.\n${d.get('m')}`)}`,'_blank')},
  async profil(f,d){const a=await DB.get('settings','admin');a.nama=d.get('nama').trim()||a.nama;const fi=d.get('foto');if(fi&&fi.size)a.foto=await resize(fi,500);await DB.put('settings',a);toast('Profil disimpan');route(1)},
  async pass(f,d){const a=await DB.get('settings','admin'),n=d.get('baru');if(await sha(d.get('lama'))!==a.hash)throw new Error('Password lama salah');if(n.length<6)throw new Error('Password minimal 6 karakter');a.hash=await sha(n);await DB.put('settings',a);f.reset();toast('Password diganti')},
  async ann(f,d){const j=d.get('judul').trim(),s=d.get('isi').trim(),id=+d.get('id');if(!j||!s)throw new Error('Judul dan isi wajib diisi');
    const r=id?await DB.get('announcements',id):{tgl:Date.now()};r.judul=j;r.isi=s;const fi=d.get('img');if(fi&&fi.size)r.img=await resize(fi,1200);
    id?await DB.put('announcements',r):await DB.add('announcements',r);toast(id?'Pengumuman diperbarui':'Pengumuman tersimpan');route(1)},
  async anggota(f,d){const k=d.get('key'),old=(await DB.get('members',k))||CONFIG.MEMBERS[k],m={...old,key:k,nama:d.get('nama').trim(),jabatan:d.get('jabatan').trim(),bio:d.get('bio').trim()};const fi=d.get('foto');if(fi&&fi.size)m.foto=await resize(fi,600);await DB.put('members',m);toast('Data anggota disimpan');route(1)},
  async upload(f,d){const files=d.getAll('files').filter(x=>x.size),bar=$('#pb');let ok=0;
    for(const [i,file] of files.entries()){try{const img=file.type.startsWith('image/'),vid=file.type.startsWith('video/');
      if(!img&&!vid)throw new Error('format tidak didukung');if(img&&file.size>15e6)throw new Error('foto terlalu besar');if(vid&&file.size>3e8)throw new Error('video terlalu besar');
      await DB.add('gallery',{type:img?'foto':'video',blob:img?await resize(file,1600):file,name:file.name,date:Date.now()});ok++}
      catch(e){toast(`${file.name}: ${e.message}`,1)}bar.style.width=((i+1)/files.length*100)+'%'}
    toast(`${ok} dari ${files.length} file berhasil diunggah`);route(1)}
};

/* ===== AKSI KLIK ===== */
const Actions={
  menu(){$('#nav').classList.toggle('open')},gtab(b){State.gtab=b.dataset.v;route(1)},atab(b){State.atab=b.dataset.v;route(1)},
  lb(b){LB.open(+b.dataset.i)},lbx(){LB.close()},lbp(){LB.go(-1)},lbn(){LB.go(1)},refresh(){route(1)},
  asort(){State.asort=State.asort==='desc'?'asc':'desc';route(1)},
  logout(){Auth.logout();toast('Anda sudah keluar');route(1)},
  async annEdit(b){const a=await DB.get('announcements',+b.dataset.id),f=$('#af');f.id.value=a.id;f.judul.value=a.judul;f.isi.value=a.isi;$('#aft').textContent='Edit pengumuman';f.scrollIntoView({behavior:'smooth'})},
  async annDel(b){if(await ask('Hapus pengumuman ini secara permanen?')){await DB.del('announcements',+b.dataset.id);toast('Pengumuman dihapus');route(1)}},
  async galDel(b){if(await ask('Hapus file ini dari galeri?')){await DB.del('gallery',+b.dataset.id);toast('File dihapus');route(1)}},
  async export(){const blob=new Blob([JSON.stringify(await Data.export())],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='safari-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3);toast('Backup diunduh')},
  async reset(){if(await ask('Semua data (pengumuman, galeri, anggota, akun) akan dihapus. Lanjutkan?')){for(const s of STORE_NAMES)await DB.clear(s);Auth.logout();location.reload()}}
};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(b&&Actions[b.dataset.act]){if(b.tagName==='A')e.preventDefault();try{await Actions[b.dataset.act](b)}catch(x){toast(x.message,1)}}else if(e.target.id==='lb')LB.close();Auth.touch()});
document.addEventListener('submit',async e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const btn=f.querySelector('[type=submit]');if(btn)btn.disabled=true;
  try{await Forms[f.dataset.form](f,new FormData(f))}catch(x){console.error(x);toast(x.message||'Terjadi kesalahan',1)}finally{if(btn)btn.disabled=false}});
document.addEventListener('input',debounce(e=>{const f=e.target.closest('[data-filter]');if(!f)return;const q=f.value.toLowerCase();$$(f.dataset.filter+' [data-t]').forEach(x=>x.style.display=x.dataset.t.includes(q)?'':'none')},200));
document.addEventListener('change',async e=>{const t=e.target;
  if(t.dataset.prev&&t.files[0])$('#'+t.dataset.prev).src=bu(t.files[0]);
  if(t.id==='imp'&&t.files[0]){try{const o=JSON.parse(await t.files[0].text());if(await ask('Data saat ini akan diganti dengan isi file backup. Lanjutkan?')){await Data.import(o);toast('Data berhasil dipulihkan');route(1)}}catch(x){toast(x.message,1)}t.value=''}});
document.addEventListener('keydown',e=>{Auth.touch();if(!$('#lb').classList.contains('on'))return;if(e.key==='Escape')LB.close();if(e.key==='ArrowLeft')LB.go(-1);if(e.key==='ArrowRight')LB.go(1)});
let sx=0;$('#lb').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
$('#lb').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)LB.go(d<0?1:-1)});

/* ===== ANIMASI ===== */
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.1});
function typer(el){const w=['Desain, foto, dan video','Percetakan dan programming','Berkarya untuk komunitas'];let i=0,j=0,del=false;
  (function tick(){if(!el.isConnected)return;const t=w[i];el.textContent=t.slice(0,j);if(!del&&j===t.length){del=true;return setTimeout(tick,1400)}if(del&&j===0){del=false;i=(i+1)%w.length}j+=del?-1:1;setTimeout(tick,del?35:70)})()}
function counters(){$$('[data-n]').forEach(el=>{const n=+el.dataset.n;let s=null;const st=t=>{s??=t;const p=Math.min((t-s)/1200,1);el.textContent=Math.round(n*p);if(p<1)requestAnimationFrame(st)};requestAnimationFrame(st)})}

/* ===== ROUTER ===== */
const ROUTES=['home','profil','keahlian','pekerjaan','galeri','pengumuman','kontak','admin'];
async function route(keep){
  live.forEach(u=>URL.revokeObjectURL(u));live=[];
  const r=location.hash.slice(1),p=ROUTES.includes(r)?r:'home';
  try{$('#app').innerHTML=await Pages[p]()}catch(e){console.error(e);$('#app').innerHTML=`<div class="card">Terjadi kesalahan: ${esc(e.message)}</div>`}
  $$('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+p));
  $('#nav').classList.remove('open');if(keep!==1)window.scrollTo({top:0,behavior:'smooth'});
  $$('.rv').forEach(x=>io.observe(x));if($('#typ'))typer($('#typ'));counters();
}
window.addEventListener('hashchange',()=>route());

/* ===== MULAI ===== */
(async()=>{
  $('#hl').innerHTML=LOGO;
  $('#foot').innerHTML=`<div style="width:50px;margin:auto">${LOGO}</div><p class="gt fh" style="font-weight:800">P&amp;M SAFARI</p><p>Seksi Publikasi dan Multimedia, Biara Vokasionis Maumere</p><p><a href="#home">Home</a><a href="#galeri">Galeri</a><a href="#pengumuman">Pengumuman</a><a href="#kontak">Kontak</a></p><br>${social()}<br><p>© ${new Date().getFullYear()} Safari Multimedia</p>`;
  try{await DB.open();await Auth.init()}catch(e){toast(e.message,1)}
  await route();
  setInterval(()=>{if(sessionStorage.getItem('sm_s')&&!Auth.ok()){Auth.logout();toast('Sesi berakhir, silakan login lagi',1);if(location.hash==='#admin')route(1)}},30000);
})();
</script></body></html>
